[package]
name = "taskmaster"
version = "0.1.0"
description = "A local-first task board and mind map"
authors = ["Taskmaster"]
edition = "2021"

[lib]
name = "taskmaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"
